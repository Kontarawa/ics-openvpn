# The name of our workflow
name: Build
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
          target: [UiOvpn23]
    name: "Release ${{ matrix.target }}"
    runs-on: ubuntu-latest
    steps:
      - name: Use debug signing
        run: mkdir -p ~/.gradle && echo -e "icsopenvpnDebugSign=true\norg.gradle.jvmargs=-Xmx4096M" > ~/.gradle/gradle.properties
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true
      - name: Build the app
        run: ./gradlew assemble${{ matrix.target }}Release
      - name: Run Unit tests
        run: ./gradlew -PtestBuildType=release test${{ matrix.target }}ReleaseUnitTest

      - name: Archive apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{matrix.target}}-release-apk
          path: main/build/outputs/apk/**/*universal*.apk
